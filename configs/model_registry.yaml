# Model registry: maps Hugging Face model ids (exact or fnmatch pattern) to
# backend profiles applied on top of the experiment config's `model` section.
#
# Resolution order: exact model_id match, then the first pattern match in file
# order, then the built-in attribute walk in
# src/repsteer/models/huggingface.py (_LAYER_PATHS).
#
# Profile fields (all optional; unset means "leave the config value alone"):
#   layer_path         attribute path walked from the model object,
#                      e.g. "model.language_model.layers"
#   layer_regex        regex searched against model.named_modules() names;
#                      matches are collected in deterministic natural order.
#                      Mutually exclusive with layer_path in practice
#                      (layer_path wins when both are set).
#   tokenizer_id       tokenizer repo id when it differs from model_id
#   dtype              torch dtype name, e.g. "bfloat16"
#   use_chat_template  apply the tokenizer chat template to prompts
#   trust_remote_code  pass trust_remote_code=True to from_pretrained
#
# Provenance: the google/gemma* profile mirrors the production dissemination
# runs (scripts/pbs_gemma4_steering.sh chain), which resolved
# model.language_model.layers (n=60) on google/gemma-4-31B-it with the chat
# template enabled and bfloat16 weights.
profiles:
  "google/gemma*":
    layer_path: model.language_model.layers
    use_chat_template: true
    dtype: bfloat16

  "meta-llama/Llama-2*":
    layer_path: model.layers
    use_chat_template: false
    dtype: bfloat16

  "meta-llama/Meta-Llama-3*":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "gpt2*":
    layer_path: transformer.h
    use_chat_template: false
    dtype: float32

  "chatlm/mlp-demo":
    layer_regex: 'model\.layers\.\d+\.mlp$'
    use_chat_template: true

  # --- scaling study (13 study models + judge models) ----------------------
  #
  # Layer paths verified against each released architecture:
  #   Gemma-4 (E2B/E4B/31B)  -> model.language_model.layers (Gemma4ForCausalLM
  #                             wraps language_model; the natively-multimodal
  #                             E-series checkpoints are loaded as text
  #                             CausalLMs and must sit on a single GPU)
  #   Qwen3.5                -> model.layers (loaded as text-only
  #                             AutoModelForCausalLM)
  #   Granite 4.2            -> model.layers
  #   OLMo 3                 -> model.layers
  #   gpt-oss                -> model.layers; harmony chat template renders the
  #                             analysis channel, so generation starts with the
  #                             final-channel prefix and reasoning_effort=low
  "google/gemma-4-E2B-it":
    layer_path: model.language_model.layers
    use_chat_template: true
    dtype: bfloat16
    single_device: true

  "google/gemma-4-E4B-it":
    layer_path: model.language_model.layers
    use_chat_template: true
    dtype: bfloat16
    single_device: true

  "google/gemma-4-31B-it":
    layer_path: model.language_model.layers
    use_chat_template: true
    dtype: bfloat16

  "Qwen/Qwen3.5-2B":
    loader: causal_lm
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "Qwen/Qwen3.5-9B":
    loader: causal_lm
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "Qwen/Qwen3.5-27B":
    loader: causal_lm
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "Qwen/Qwen3.5-122B-A10B":
    loader: causal_lm
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "ibm-granite/granite-4.2-3b":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "ibm-granite/granite-4.2-8b":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "ibm-granite/granite-4.2-30b":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "allenai/Olmo-3-7B-Instruct":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "allenai/Olmo-3.1-32B-Instruct":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "openai/gpt-oss-120b":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16
    generation_prefix: "<|channel|>final<|message|>"
    chat_template_kwargs:
      reasoning_effort: low
      fixed_date: "2026-10-17"  # template prints "Current date:"; pinned for reproducibility

  # Judge models
  "Qwen/Qwen3.6-27B":
    loader: causal_lm
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16

  "zai-org/GLM-4.5-Air":
    layer_path: model.layers
    use_chat_template: true
    dtype: bfloat16
